name: networknuts-lab-python-metrics
services:
  api:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Copy .env.example to .env first}
    ports: ["127.0.0.1:18000:8000"]
    mem_limit: 256m
    cpus: 1
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  prometheus:
    image: ${PROMETHEUS_IMAGE:?Copy .env.example to .env first}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1h"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:19090:9090"]
    mem_limit: 512m
    cpus: 1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
